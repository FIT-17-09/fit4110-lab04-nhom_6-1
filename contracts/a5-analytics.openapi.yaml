openapi: 3.0.3
info:
  title: A5 Analytics Events
  version: 1.0.0
  description: |
    Product: A5
    Provider: Analytics
    Consumers: IoT Ingestion / Camera Stream / Core Business / Access Gate
servers:
  - url: http://localhost:8000
    description: Local server
  - url: http://analytics:8000
    description: Docker Compose
x-product: A5
x-provider: Analytics
x-consumers:
  - IoT Ingestion
  - Camera Stream
  - Core Business
  - Access Gate
paths:
  /analytics/events:
    post:
      summary: Publish analytics event
      description: |
        Event producers submit analytics events to the Analytics provider.
        Consumers that may subscribe or pull these events: IoT Ingestion, Camera Stream, Core Business, Access Gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEvent'
            example:
              event_id: "evt-12345"
              source: "camera-01"
              source_type: "camera"
              event_type: "object_detected"
              timestamp: "2026-06-03T12:34:56Z"
              payload:
                object: "person"
                confidence: 0.93
                bbox: [100, 150, 200, 350]
              metadata:
                zone: "entrance"
      responses:
        '201':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    AnalyticsEvent:
      type: object
      required: [event_id, source, source_type, event_type, timestamp, payload]
      properties:
        event_id:
          type: string
          description: Unique event identifier
        source:
          type: string
          description: Identifier of the producing device or service
        source_type:
          type: string
          description: Type of producer
          enum: [camera, sensor, service]
        event_type:
          type: string
          description: Semantic event type
          enum: [object_detected, anomaly, access_event, heartbeat, custom]
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          description: Event-specific data; schema varies by event_type
          additionalProperties: true
        metadata:
          type: object
          description: Optional routing or contextual metadata
          properties:
            zone:
              type: string
            priority:
              type: string
              enum: [low, medium, high]
    EventAccepted:
      type: object
      properties:
        event_id:
          type: string
        received_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [accepted, queued]
      required: [event_id, received_at, status]
security: []
